<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Thư Viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Login Page -->
    <div id="login-page" class="d-none">
        <div class="container">
            <div class="row min-vh-100 align-items-center justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4 fw-bold">Đăng Nhập</h2>
                            <form id="login-form">
                                <div class="mb-3">
                                    <label class="form-label">Tên đăng nhập</label>
                                    <input type="text" class="form-control form-control-lg" id="username" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Mật khẩu</label>
                                    <input type="password" class="form-control form-control-lg" id="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Đăng Nhập</button>
                            </form>
                            <div id="login-error" class="alert alert-danger mt-3 d-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Application -->
    <div id="main-app" class="d-none">
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse min-vh-100">
                    <div class="position-sticky pt-3">
                        <div class="text-center mb-4">
                            <i class="fas fa-book-reader fa-3x text-primary mb-2"></i>
                            <h5 class="text-white">LMS Admin</h5>
                        </div>
                        <ul class="nav flex-column mt-3">
                            <li class="nav-item">
                                <a class="nav-link text-white active" href="#" data-page="dashboard">
                                    <i class="fas fa-home me-2"></i> Tổng quan
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="#" data-page="books">
                                    <i class="fas fa-books me-2"></i> Quản lý Sách
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="#" data-page="categories">
                                    <i class="fas fa-tags me-2"></i> Thể loại
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="#" data-page="authors">
                                    <i class="fas fa-user-edit me-2"></i> Tác giả
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="#" data-page="borrows">
                                    <i class="fas fa-exchange-alt me-2"></i> Mượn & Trả
                                </a>
                            </li>
                            <li class="nav-item" id="nav-users">
                                <a class="nav-link text-white" href="#" data-page="users">
                                    <i class="fas fa-users me-2"></i> Người dùng
                                </a>
                            </li>
                        </ul>
                        <div class="mt-5 px-3">
                            <button class="btn btn-outline-danger w-100" id="btn-logout">
                                <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                            </button>
                        </div>
                    </div>
                </nav>

                <!-- Content Area -->
                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2" id="page-title">Tổng quan</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <span class="me-3 align-self-center">Chào, <strong id="user-fullname">Admin</strong></span>
                        </div>
                    </div>

                    <div id="content-area">
                        <!-- Dynamic Content will be loaded here -->
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-container"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- App JS -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
